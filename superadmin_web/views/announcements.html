<div class="view-content ann-view-container">
    <!-- Header Section -->
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; background: var(--surface-color); padding: 24px 28px; border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border-color);">
        <div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                <h2 style="margin: 0; font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">Announcements & Broadcasts</h2>
                <span style="background: rgba(15, 50, 96, 0.08); color: var(--primary-color); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;">Super Admin</span>
            </div>
            <p style="margin: 0; color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 6px;">
                <i class="icon-info" style="font-size: 14px;"></i> Publish campus notices, deadline reminders, and verification updates to all scholars.
            </p>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <button id="btn-ann-refresh" class="icon-btn" title="Refresh Announcements" style="width: 42px; height: 42px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--surface-color); color: var(--text-secondary);">
                <i class="icon-refresh-cw" style="font-size: 16px;"></i>
            </button>
            <button class="btn btn-primary" id="btn-add-ann" style="width: auto; height: 44px; padding: 0 22px; margin-top: 0; background: linear-gradient(135deg, #0A1E3F 0%, #1E355A 100%); color: white; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; border: none; box-shadow: 0 6px 16px rgba(10, 30, 63, 0.15); transition: all 0.25s ease; cursor: pointer;">
                <i class="icon-megaphone" style="font-size: 16px;"></i> Post New Update
            </button>
        </div>
    </div>

    <!-- Summary Metrics Overview Bar -->
    <div class="ann-metrics-grid">
        <!-- Total Announcements -->
        <div class="ann-metric-card">
            <div class="ann-metric-icon" style="background: rgba(15, 50, 96, 0.08); color: var(--primary-color);">
                <i class="icon-megaphone"></i>
            </div>
            <div class="ann-metric-info">
                <span class="ann-metric-label">Total Posts</span>
                <span class="ann-metric-value" id="ann-stat-total">0</span>
            </div>
        </div>

        <!-- Live Broadcasts -->
        <div class="ann-metric-card">
            <div class="ann-metric-icon" style="background: rgba(16, 185, 129, 0.12); color: #059669;">
                <i class="icon-radio"></i>
            </div>
            <div class="ann-metric-info">
                <span class="ann-metric-label">Live Broadcasts</span>
                <span class="ann-metric-value" id="ann-stat-live" style="color: #059669;">0</span>
            </div>
        </div>

        <!-- Deadlines -->
        <div class="ann-metric-card">
            <div class="ann-metric-icon" style="background: rgba(239, 68, 68, 0.12); color: #DC2626;">
                <i class="icon-calendar-clock"></i>
            </div>
            <div class="ann-metric-info">
                <span class="ann-metric-label">Deadlines Active</span>
                <span class="ann-metric-value" id="ann-stat-deadlines" style="color: #DC2626;">0</span>
            </div>
        </div>

        <!-- Archived -->
        <div class="ann-metric-card">
            <div class="ann-metric-icon" style="background: rgba(148, 163, 184, 0.15); color: #64748B;">
                <i class="icon-archive"></i>
            </div>
            <div class="ann-metric-info">
                <span class="ann-metric-label">Archived Notices</span>
                <span class="ann-metric-value" id="ann-stat-archived" style="color: #64748B;">0</span>
            </div>
        </div>
    </div>

    <!-- Toolbar: Search, Filters & Controls -->
    <div class="ann-toolbar">
        <div class="ann-toolbar-left">
            <div class="ann-search-wrapper">
                <i class="icon-search"></i>
                <input type="text" id="ann-search-input" class="ann-search-input" placeholder="Search announcements by title, content, or type..." autocomplete="off">
                <button type="button" id="ann-search-clear" class="ann-search-clear" title="Clear search">
                    <i class="icon-x" style="font-size: 14px;"></i>
                </button>
            </div>
            <span id="ann-results-count" style="font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap;">
                Loading...
            </span>
        </div>

        <div class="ann-toolbar-right">
            <!-- Filter Pills -->
            <div class="ann-filter-pills" role="tablist">
                <button type="button" class="ann-filter-pill active" data-filter="all">All</button>
                <button type="button" class="ann-filter-pill" data-filter="General">General</button>
                <button type="button" class="ann-filter-pill" data-filter="Update">Updates</button>
                <button type="button" class="ann-filter-pill" data-filter="Deadline">Deadlines</button>
                <button type="button" class="ann-filter-pill" data-filter="archived">Archived</button>
            </div>

            <!-- Sort Select -->
            <div style="display: flex; align-items: center; gap: 6px;">
                <i class="icon-arrow-up-down" style="font-size: 13px; color: var(--text-secondary);"></i>
                <select id="ann-sort-select" class="ann-sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="deadline-first">Deadlines First</option>
                    <option value="title-asc">Title (A → Z)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Modern Card-Based Announcement Grid Container -->
    <div id="announcements-cards-grid" class="ann-cards-grid">
        <!-- Skeleton Loaders rendered dynamically by JS -->
    </div>
    
    <!-- Backward compatibility hook -->
    <div id="announcements-list" style="display: none;"></div>
</div>

<!-- Add / Edit Announcement Modal -->
<div id="ann-modal" class="hidden" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); transition: opacity 0.25s ease;">
    <div class="card" style="width: 90%; max-width: 520px; padding: 30px; position: relative; border-radius: 20px; box-shadow: 0 24px 48px rgba(0,0,0,0.25); background: var(--surface-color); border: 1px solid var(--border-color); animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);">
        <button id="close-ann-modal-btn" class="icon-btn" type="button" style="position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.04); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all 0.2s;" title="Close">
            <i class="icon-x" style="font-size: 18px;"></i>
        </button>
        
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 22px;">
            <div id="ann-modal-avatar" style="width: 44px; height: 44px; background: linear-gradient(135deg, #0F3260 0%, #1E4976 100%); color: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 12px rgba(15, 50, 96, 0.2);">
                <i class="icon-megaphone" style="font-size: 22px;"></i>
            </div>
            <div>
                <h2 style="margin: 0; font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.3px;" id="ann-modal-title">Post Announcement</h2>
                <p style="margin: 2px 0 0 0; font-size: 12px; color: var(--text-secondary);">Compose and broadcast an update to registered scholars.</p>
            </div>
        </div>
        
        <form id="ann-form" style="display: flex; flex-direction: column; gap: 18px;">
            <!-- Category Radio Selector -->
            <div>
                <label style="font-size: 13px; font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 8px;">Notice Category</label>
                <div class="ann-type-selector">
                    <label class="ann-type-option">
                        <input type="radio" name="ann-type" value="General" checked style="display: none;">
                        <div class="ann-type-box type-general">
                            <i class="icon-megaphone"></i>
                            <span>General</span>
                        </div>
                    </label>
                    <label class="ann-type-option">
                        <input type="radio" name="ann-type" value="Update" style="display: none;">
                        <div class="ann-type-box type-update">
                            <i class="icon-refresh-cw"></i>
                            <span>Update</span>
                        </div>
                    </label>
                    <label class="ann-type-option">
                        <input type="radio" name="ann-type" value="Deadline" style="display: none;">
                        <div class="ann-type-box type-deadline">
                            <i class="icon-calendar-clock"></i>
                            <span>Deadline</span>
                        </div>
                    </label>
                </div>
            </div>
            
            <!-- Announcement Title -->
            <div>
                <label style="font-size: 13px; font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 7px;">Announcement Title <span style="color: #EF4444;">*</span></label>
                <input type="text" id="ann-inp-title" required placeholder="e.g. 2nd Semester TES Stipend Release Schedule" style="width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 12px; background: var(--background-color); outline: none; font-family: inherit; font-size: 14px; color: var(--text-primary); transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)'; this.style.boxShadow='0 0 0 3px rgba(15, 50, 96, 0.08)';" onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';">
            </div>
            
            <!-- Message Body -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="font-size: 13px; font-weight: 700; color: var(--text-primary); display: block; margin: 0;">Message Content <span style="color: #EF4444;">*</span></label>
                    <span id="ann-char-counter" style="font-size: 11px; color: var(--text-secondary);">0 chars</span>
                </div>
                <textarea id="ann-inp-content" required rows="5" placeholder="Type the complete details of the announcement here..." style="width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 12px; background: var(--background-color); outline: none; font-family: inherit; font-size: 13px; color: var(--text-primary); resize: vertical; line-height: 1.5; transition: all 0.2s;" onfocus="this.style.borderColor='var(--primary-color)'; this.style.boxShadow='0 0 0 3px rgba(15, 50, 96, 0.08)';" onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';"></textarea>
            </div>

            <!-- Actions -->
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 6px;">
                <button type="button" class="btn" id="ann-modal-cancel-btn" style="padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 13px; background: var(--surface-color); color: var(--text-secondary); border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s;">Cancel</button>
                <button type="submit" class="btn btn-primary" id="ann-modal-save-btn" style="padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 13px; background: linear-gradient(135deg, #0A1E3F 0%, #1E355A 100%); color: white; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(10, 30, 63, 0.2); transition: all 0.2s;">Post Announcement</button>
            </div>
        </form>
    </div>
</div>
