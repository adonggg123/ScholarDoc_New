<div class="view-content" style="display: flex; flex-direction: column; gap: 24px; height: 100%; overflow-y: auto;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div>
            <h2 style="margin: 0 0 4px 0; font-size: 24px; font-weight: 800;">ID Validation Queue</h2>
            <p style="margin: 0; color: var(--text-secondary); font-size: 13px;">Validate student IDs and signatures for application finalization.</p>
        </div>
        <button id="bulk-download-btn" class="btn" style="background: var(--primary-color, #0F3260); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(15, 50, 96, 0.2); transition: all 0.2s;" onclick="downloadAllIdDocuments()">
            <i class="icon-download" style="font-size: 16px;"></i>
            <span>Download All Documents</span>
        </button>
    </div>

    <!-- Bulk Download Progress Modal -->
    <div id="bulk-download-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center;">
        <div style="background: var(--surface-color, #fff); width: 90%; max-width: 440px; border-radius: 16px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; border: 1px solid var(--border-color);">
            <div id="modal-icon-container" style="width: 56px; height: 56px; border-radius: 50%; background: rgba(15, 50, 96, 0.08); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                <i id="modal-icon" class="icon-file-archive" style="font-size: 28px; color: var(--primary-color, #0F3260);"></i>
            </div>
            <h3 id="modal-title" style="margin: 0 0 8px 0; font-size: 18px; font-weight: 800; color: var(--text-primary);">Generating ZIP Archive...</h3>
            <p id="modal-subtitle" style="margin: 0 0 20px 0; font-size: 13px; color: var(--text-secondary); line-height: 1.4;">Collecting student PDF requirements from database...</p>

            <!-- Progress Bar Container -->
            <div style="width: 100%; background: rgba(0,0,0,0.06); height: 10px; border-radius: 20px; overflow: hidden; margin-bottom: 12px; position: relative;">
                <div id="modal-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #0F3260, #D4AF37); border-radius: 20px; transition: width 0.25s ease-out;"></div>
            </div>
            <div id="modal-percentage" style="font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 16px;">0%</div>

            <div id="modal-actions" style="display: none; justify-content: center; gap: 12px; margin-top: 16px;">
                <button id="modal-close-btn" class="btn" style="background: var(--primary-color, #0F3260); color: white; border: none; padding: 8px 24px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;" onclick="closeBulkDownloadModal()">Close</button>
            </div>
        </div>
    </div>


    <div style="display: grid; grid-template-columns: 3fr 2fr; gap: 24px; align-items: start;" id="id-grid">
        
        <!-- Left: Queue List -->
        <div class="card" style="padding: 0; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
            <div id="id-list-container" style="display: flex; flex-direction: column; max-height: 700px; overflow-y: auto;">
                <div style="text-align: center; padding: 40px; color: var(--text-secondary);">Loading ID validation queue...</div>
            </div>
        </div>

        <!-- Right: Validation Panel -->
        <div class="card" style="box-shadow: 0 2px 8px rgba(0,0,0,0.03); position: sticky; top: 0;" id="id-panel-container">
            <div style="text-align: center; padding: 40px; color: var(--text-secondary);">Select a student to view details.</div>
        </div>

    </div>
</div>

<style>
    @media (max-width: 900px) {
        #id-grid {
            grid-template-columns: 1fr !important;
        }
        #id-panel-container {
            position: relative;
        }
    }
    .id-list-item {
        transition: background 0.2s;
        cursor: pointer;
    }
    .id-list-item:hover {
        background: rgba(0,0,0,0.02);
    }
    .id-list-item.selected {
        background: rgba(15, 50, 96, 0.04);
    }
</style>
