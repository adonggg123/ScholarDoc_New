<!-- ScholarDoc Student Web — Scholar Directory View -->
<!-- Mirrors user_directory_screen.dart -->

<div class="card" style="background: linear-gradient(135deg, #0F3260, #1E3A8A); border: none; margin-bottom: 24px; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(251,192,45,0.1) 0%, transparent 70%); border-radius: 50%;"></div>
    <div style="padding: 24px 28px; position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div>
            <div style="font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 1.5px; text-transform: uppercase;">SCHOLAR DIRECTORY</div>
            <div style="font-size: 20px; font-weight: 800; color: white; letter-spacing: -0.3px; margin-top: 4px;">Connect with Scholars</div>
            <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px;">Search and view profiles of fellow scholars</div>
        </div>
        <div style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;">
            <i class="icon-users" style="color: white; width: 22px; height: 22px;"></i>
        </div>
    </div>
</div>

<!-- Search Input -->
<div style="margin-bottom: 20px;">
    <div class="form-control-icon">
        <i class="icon-search" style="color: var(--primary-color);"></i>
        <input type="text" class="form-control" id="search-input" placeholder="Search by name, major, or scholarship..." style="height: 48px; border-radius: var(--radius-lg); font-size: 14px; box-shadow: var(--shadow-sm);">
    </div>
</div>

<!-- Grid List of Scholars -->
<div id="scholars-grid" class="grid-3">
    <div class="spinner-container"><div class="spinner"></div></div>
</div>

<!-- Empty State -->
<div class="empty-state hidden" id="directory-empty">
    <i class="icon-search-x" style="width: 48px; height: 48px; opacity: 0.4;"></i>
    <h3>No scholars found</h3>
    <p>Try refining your search terms.</p>
</div>
