<!-- ScholarDoc Student Web — Scholar Directory View -->
<!-- Mirrors user_directory_screen.dart -->

<div class="card view-page-header">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div>
                <div class="page-label">SCHOLAR DIRECTORY</div>
                <div class="page-title">Connect with Scholars</div>
                <div class="page-subtitle">Search and view profiles of fellow scholars</div>
            </div>
            <div class="page-icon">
                <i data-lucide="users"></i>
            </div>
        </div>
    </div>
</div>

<!-- Search Input -->
<div style="margin-bottom: 22px;">
    <div class="form-control-icon">
        <i data-lucide="search" style="color: var(--primary-color);"></i>
        <input type="text" class="form-control" id="search-input" placeholder="Search by name, major, or scholarship..." style="height: 48px; border-radius: var(--radius-lg); font-size: 14px; box-shadow: var(--shadow-sm);">
    </div>
</div>

<!-- Grid List of Scholars -->
<div id="scholars-grid" class="grid-3">
    <div class="spinner-container"><div class="spinner"></div></div>
</div>

<!-- Empty State -->
<div class="empty-state hidden" id="directory-empty">
    <i data-lucide="search-x"></i>
    <h3>No scholars found</h3>
    <p>Try refining your search terms.</p>
</div>
