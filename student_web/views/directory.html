<!-- ScholarDoc Student Web — Scholar Directory View -->
<!-- Mirrors user_directory_screen.dart -->

<!-- Header Banner -->
<div class="card view-page-header">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 16px;">
            <div>
                <div class="page-label">SCHOLAR DIRECTORY</div>
                <div class="page-title">Campus Scholar Directory</div>
                <div class="page-subtitle">Search and connect with fellow scholarship recipients across all university programs</div>
            </div>
            <div style="width: 48px; height: 48px; border-radius: var(--radius-xl); background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
                <i data-lucide="users" style="width: 24px; height: 24px; color: white;"></i>
            </div>
        </div>
    </div>
</div>

<!-- Search Input Field -->
<div class="mb-lg">
    <div class="form-control-icon">
        <i data-lucide="search"></i>
        <input type="text" class="form-control" id="search-input" placeholder="Search by scholar name, course, section, or scholarship..." style="height: 52px; font-size: 14.5px;">
    </div>
</div>

<!-- Grid List of Scholars -->
<div id="scholars-grid" class="grid-3 mb-lg">
    <div class="spinner-container">
        <div class="spinner"></div>
    </div>
</div>

<!-- Empty State -->
<div class="empty-state hidden" id="directory-empty">
    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--primary-surface); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <i data-lucide="search-x" style="width: 28px; height: 28px; color: var(--primary);"></i>
    </div>
    <h3>No Scholars Found</h3>
    <p>No scholar matches your current search criteria. Try refining your keywords or search query.</p>
</div>
