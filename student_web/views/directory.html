<!-- ScholarDoc Student Web — Scholar Directory View -->
<!-- Mirrors user_directory_screen.dart -->

<!-- Header Banner -->
<div class="card view-page-header" style="margin-bottom: 24px;">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div>
                <div class="page-label">SCHOLAR DIRECTORY</div>
                <div class="page-title">Connect with Scholars</div>
                <div class="page-subtitle">Search and view profiles of fellow scholars across campus</div>
            </div>
            <div class="page-icon" style="width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="users" style="width: 26px; height: 26px; color: white;"></i>
            </div>
        </div>
    </div>
</div>

<!-- Search Input Field -->
<div style="margin-bottom: 24px;">
    <div class="form-control-icon" style="position: relative;">
        <i data-lucide="search" style="color: var(--primary-color); width: 20px; height: 20px;"></i>
        <input type="text" class="form-control" id="search-input" placeholder="Search by name, course, section, or scholarship..." style="height: 52px; border-radius: var(--radius-xl); font-size: 14px; font-weight: 500; box-shadow: var(--shadow-sm); border: 1.5px solid var(--border-color); padding-left: 48px;">
    </div>
</div>

<!-- Grid List of Scholars -->
<div id="scholars-grid" class="grid-3" style="margin-bottom: 28px;">
    <div class="spinner-container"><div class="spinner"></div></div>
</div>

<!-- Empty State -->
<div class="empty-state hidden" id="directory-empty" style="padding: 48px 24px; text-align: center;">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(15,50,96,0.06); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <i data-lucide="search-x" style="width: 32px; height: 32px; color: var(--text-secondary);"></i>
    </div>
    <h3 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px;">No Scholars Found</h3>
    <p style="font-size: 13px; color: var(--text-secondary);">Try refining your search query or clear keywords.</p>
</div>
