<!-- ScholarDoc Student Web — Submission History View -->
<!-- Mirrors submission_history_screen.dart -->

<!-- Header -->
<div class="card" style="background: linear-gradient(135deg, #0F3260, #1E3A8A); border: none; margin-bottom: 24px; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(251,192,45,0.1) 0%, transparent 70%); border-radius: 50%;"></div>
    <div style="padding: 24px 28px; position: relative; z-index: 2;">
        <div style="font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 1.5px;">SUBMISSION HISTORY</div>
        <div style="font-size: 20px; font-weight: 800; color: white; letter-spacing: -0.3px; margin-top: 4px;" id="history-scholarship">Your Documents</div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px;" id="history-subtitle">Track all your submitted documents</div>
    </div>
</div>

<!-- Timeline -->
<div id="history-list">
    <div class="spinner-container"><div class="spinner"></div></div>
</div>

<!-- Empty State (hidden by default) -->
<div class="empty-state hidden" id="history-empty">
    <i data-lucide="folder-open"></i>
    <h3>No Submissions Yet</h3>
    <p>You haven't submitted any documents yet. Start by uploading your requirements.</p>
    <button class="btn btn-primary-solid mt-md" onclick="loadView('submit')">
        <i data-lucide="upload-cloud"></i> Submit Documents
    </button>
</div>
