<!-- ScholarDoc Student Web — Submission History View -->
<!-- Mirrors submission_history_screen.dart -->

<!-- Header Banner -->
<div class="card view-page-header">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 16px;">
            <div>
                <div class="page-label">SUBMISSION HISTORY</div>
                <div class="page-title" id="history-scholarship">Document Submission Log</div>
                <div class="page-subtitle" id="history-subtitle">Track and view all your submitted requirement files and receipts</div>
            </div>
            <div style="width: 48px; height: 48px; border-radius: var(--radius-xl); background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
                <i data-lucide="folder-open" style="width: 24px; height: 24px; color: white;"></i>
            </div>
        </div>
    </div>
</div>

<!-- History Log List Container -->
<div id="history-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px;">
    <div class="spinner-container">
        <div class="spinner"></div>
    </div>
</div>

<!-- Empty State -->
<div class="empty-state hidden" id="history-empty">
    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--primary-surface); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <i data-lucide="folder-open" style="width: 28px; height: 28px; color: var(--primary);"></i>
    </div>
    <h3>No Submission History Found</h3>
    <p>You haven't submitted any scholarship requirement files yet. Upload your ID cards and bank details to start.</p>
    <button class="btn btn-primary-solid mt-md" onclick="loadView('submit')">
        <i data-lucide="upload-cloud"></i> Submit Requirements
    </button>
</div>
