<!-- ScholarDoc Student Web — Submission History View -->
<!-- Mirrors submission_history_screen.dart -->

<!-- Header -->
<div class="card view-page-header">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div class="page-label">SUBMISSION HISTORY</div>
                <div class="page-title" id="history-scholarship">Your Documents</div>
                <div class="page-subtitle" id="history-subtitle">Track all your submitted documents</div>
            </div>
            <div class="page-icon">
                <i data-lucide="folder-open"></i>
            </div>
        </div>
    </div>
</div>

<!-- Timeline -->
<div id="history-list">
    <div class="spinner-container"><div class="spinner"></div></div>
</div>

<!-- Empty State (hidden by default) -->
<div class="empty-state hidden" id="history-empty">
    <i data-lucide="folder-open"></i>
    <h3>No Submissions Yet</h3>
    <p>You haven't submitted any documents yet. Start by uploading your requirements.</p>
    <button class="btn btn-primary-solid mt-md" onclick="loadView('submit')">
        <i data-lucide="upload-cloud"></i> Submit Documents
    </button>
</div>
