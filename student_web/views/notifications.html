<!-- ScholarDoc Student Web — Notifications View -->
<!-- Mirrors notification_screen.dart -->

<div class="card view-page-header">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div>
                <div class="page-label">NOTIFICATIONS</div>
                <div class="page-title">Recent Alerts</div>
                <div class="page-subtitle">Stay updated with your scholarship status</div>
            </div>
            <button class="btn btn-sm" id="mark-all-read-btn" style="background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); flex-shrink: 0;">
                <i data-lucide="check-check" style="width: 14px; height: 14px;"></i> Mark all read
            </button>
        </div>
    </div>
</div>

<div id="notifications-list">
    <div class="spinner-container"><div class="spinner"></div></div>
</div>

<div class="empty-state hidden" id="notifications-empty">
    <i data-lucide="bell-off"></i>
    <h3>All Caught Up!</h3>
    <p>You have no notifications at the moment.</p>
</div>
