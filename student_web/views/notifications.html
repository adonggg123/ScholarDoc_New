<!-- ScholarDoc Student Web — Notifications View -->
<!-- Mirrors notification_screen.dart -->

<!-- Header Banner -->
<div class="card view-page-header">
    <div class="view-page-header-content">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 14px;">
            <div>
                <div class="page-label">NOTIFICATIONS & ALERTS</div>
                <div class="page-title">Real-Time Updates</div>
                <div class="page-subtitle">Stay informed about your scholarship verification, evaluations, and campus announcements</div>
            </div>
            <button class="btn btn-sm" id="mark-all-read-btn" style="background: rgba(255,255,255,0.18); color: white; border: 1.5px solid rgba(255,255,255,0.3); backdrop-filter: blur(8px); padding: 8px 18px;">
                <i data-lucide="check-check"></i> Mark All as Read
            </button>
        </div>
    </div>
</div>

<!-- Notification Feed List -->
<div id="notifications-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px;">
    <div class="spinner-container">
        <div class="spinner"></div>
    </div>
</div>

<!-- Empty State -->
<div class="empty-state hidden" id="notifications-empty">
    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--success-soft); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <i data-lucide="bell-off" style="width: 28px; height: 28px; color: var(--success);"></i>
    </div>
    <h3>You're All Caught Up!</h3>
    <p>You currently have no unread notifications or action alerts. Check back later for scholarship announcements.</p>
</div>
