<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarDoc — Student Dashboard</title>
    <meta name="description" content="ScholarDoc Student Dashboard — Manage your scholarship documents, track submissions, and stay updated.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/font/lucide.css" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css">
</head>
<body>
    <script>
        if (localStorage.getItem('scholardoc_theme') === 'dark') {
            document.body.classList.add('dark');
        }
    </script>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="app_logo3.png" alt="ScholarDoc Logo" class="sidebar-logo">
            <div class="sidebar-brand">
                <h2>ScholarDoc</h2>
                <p>Student Portal</p>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <hr>
            
            <a href="#" class="nav-item active" data-view="home" id="nav-home">
                <i class="icon-home"></i> Home
            </a>
            
            <a href="#" class="nav-item" data-view="status" id="nav-status">
                <i class="icon-clipboard-list"></i> Status Tracking
            </a>
            
            <a href="#" class="nav-item" data-view="submit" id="nav-submit">
                <i class="icon-upload-cloud"></i> Submit Documents
            </a>
            
            <a href="#" class="nav-item" data-view="history" id="nav-history">
                <i class="icon-history"></i> Submission History
            </a>

            <a href="#" class="nav-item" data-view="directory" id="nav-directory">
                <i class="icon-users"></i> Scholar Directory
            </a>
            
            <hr>
            
            <a href="#" class="nav-item" data-view="notifications" id="nav-notifications">
                <i class="icon-bell"></i> Notifications
                <span class="nav-badge hidden" id="nav-notif-badge">0</span>
            </a>
            
            <a href="#" class="nav-item" data-view="profile" id="nav-profile">
                <i class="icon-user"></i> My Profile
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="theme-toggle-row" id="theme-toggle">
                <i class="icon-moon"></i>
                <span>Dark Mode</span>
                <div class="theme-switch"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        <!-- Top App Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <i class="icon-menu"></i>
                </button>
                
                <div class="topbar-icon-badge" id="topbar-icon-badge">
                    <i id="topbar-icon" class="icon-home"></i>
                </div>

                <h1 class="topbar-title" id="topbar-title">Home</h1>
            </div>

            <div class="topbar-right">
                <button class="notification-btn" id="notification-btn" title="Notifications">
                    <i class="icon-bell"></i>
                    <span class="notification-count hidden" id="notification-count">0</span>
                </button>

                <div class="profile-pill" id="profile-pill">
                    <div class="profile-avatar" id="profile-avatar">
                        <span id="profile-initial">S</span>
                    </div>
                    <span class="profile-name" id="profile-name">Student</span>
                </div>

                <!-- Profile Dropdown -->
                <div class="profile-dropdown hidden" id="profile-dropdown">
                    <button class="dropdown-item" data-view="profile">
                        <i class="icon-user"></i> My Profile
                    </button>
                    <button class="dropdown-item" id="dropdown-theme-toggle">
                        <i class="icon-moon"></i> Toggle Dark Mode
                    </button>
                    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 4px 0;">
                    <button class="dropdown-item danger" id="dropdown-logout-btn">
                        <i class="icon-log-out"></i> Sign Out
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="content-area" id="app-content">
            <div class="spinner-container">
                <div class="spinner"></div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF for PDF generation in submission workflow -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Dashboard Controller -->
    <script src="js/student.js?v=2"></script>
</body>
</html>
