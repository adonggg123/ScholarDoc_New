<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarDoc — Student Portal</title>
    <meta name="description"
        content="ScholarDoc Student Dashboard — Manage your scholarship documents, track submissions, and stay updated.">
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/student.css?v=4">
</head>

<body>
    <script>
        if (localStorage.getItem('scholardoc_theme') === 'dark') {
            document.body.classList.add('dark');
        }
    </script>

    <!-- Sidebar Overlay (mobile menu backdrop) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Mobile Drawer Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="app_logo3.png" alt="ScholarDoc Logo" class="sidebar-logo">
            <div class="sidebar-brand">
                <h2>ScholarDoc</h2>
                <p>USTP Oroquieta City Campus</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-view="home" id="nav-home-mobile">
                <i data-lucide="home"></i> Home
            </a>

            <a href="#" class="nav-item" data-view="status" id="nav-status-mobile">
                <i data-lucide="clipboard-check"></i> Status Tracking
            </a>

            <a href="#" class="nav-item" data-view="submit" id="nav-submit-mobile">
                <i data-lucide="upload-cloud"></i> Submit Documents
            </a>

            <a href="#" class="nav-item" data-view="history" id="nav-history-mobile">
                <i data-lucide="history"></i> Submission History
            </a>

            <a href="#" class="nav-item" data-view="directory" id="nav-directory-mobile">
                <i data-lucide="users"></i> Scholar Directory
            </a>

            <hr class="nav-divider">

            <a href="#" class="nav-item" data-view="notifications" id="nav-notifications-mobile">
                <i data-lucide="bell"></i> Notifications
                <span class="nav-badge hidden" id="nav-notif-badge-mobile">0</span>
            </a>

            <a href="#" class="nav-item" data-view="profile" id="nav-profile-mobile">
                <i data-lucide="user"></i> My Profile
            </a>

            <hr class="nav-divider">

            <a href="#" class="nav-item" id="nav-logout-mobile" style="color: var(--error);">
                <i data-lucide="log-out"></i> Sign Out
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="theme-toggle-row" id="theme-toggle-mobile">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="moon"></i>
                    <span>Dark Mode</span>
                </div>
                <div class="theme-switch"></div>
            </div>
        </div>
    </aside>

    <!-- Top Navigation Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="header-brand-group">
                <!-- Hamburger Menu for mobile/tablet drawer -->
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation">
                    <i data-lucide="menu"></i>
                </button>

                <div class="app-logo-lockup" onclick="loadView('home')">
                    <img src="app_logo3.png" alt="ScholarDoc Logo" class="app-logo">
                    <div class="app-brand-text">
                        <span class="brand-title">ScholarDoc</span>
                        <span class="brand-subtitle">USTP Oroquieta City Campus</span>
                    </div>
                </div>
            </div>

            <!-- Tab Navigation (Desktop) -->
            <nav class="header-nav">
                <a href="#" class="nav-item active" data-view="home" id="nav-home">
                    <i data-lucide="home"></i> Home
                </a>
                <a href="#" class="nav-item" data-view="status" id="nav-status">
                    <i data-lucide="clipboard-check"></i> Status Tracking
                </a>
                <a href="#" class="nav-item" data-view="submit" id="nav-submit">
                    <i data-lucide="upload-cloud"></i> Submit Documents
                </a>
                <a href="#" class="nav-item" data-view="history" id="nav-history">
                    <i data-lucide="history"></i> History
                </a>
                <a href="#" class="nav-item" data-view="directory" id="nav-directory">
                    <i data-lucide="users"></i> Directory
                </a>
            </nav>

            <div class="header-actions">
                <!-- Notifications Button -->
                <button class="notification-btn" id="notification-btn" title="Notifications">
                    <i data-lucide="bell"></i>
                    <span class="notification-count hidden" id="notification-count">0</span>
                </button>

                <!-- Dark Mode Toggle Button (Desktop) -->
                <button class="theme-btn" id="theme-toggle" title="Toggle Theme">
                    <i data-lucide="moon" id="theme-icon"></i>
                </button>

                <!-- Profile Avatar Dropdown -->
                <div class="profile-pill-wrapper">
                    <div class="profile-pill" id="profile-pill">
                        <div class="profile-avatar" id="profile-avatar">
                            <span id="profile-initial">S</span>
                        </div>
                        <span class="profile-name" id="profile-name">Student</span>
                        <i data-lucide="chevron-down" class="profile-chevron"></i>
                    </div>

                    <!-- Profile Dropdown Menu -->
                    <div class="profile-dropdown hidden" id="profile-dropdown">
                        <div class="dropdown-header">
                            <span class="dropdown-greeting">Welcome back</span>
                        </div>
                        <button class="dropdown-item" data-view="profile">
                            <i data-lucide="user"></i> My Profile
                        </button>
                        <button class="dropdown-item" data-view="notifications">
                            <i data-lucide="bell"></i> Notifications
                            <span class="nav-badge hidden" id="nav-notif-badge">0</span>
                        </button>
                        <button class="dropdown-item" id="dropdown-theme-toggle">
                            <i data-lucide="moon"></i> Toggle Dark Mode
                        </button>
                        <hr class="dropdown-divider">
                        <button class="dropdown-item danger" id="dropdown-logout-btn">
                            <i data-lucide="log-out"></i> Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main" id="app-content-wrapper">
        <div class="content-container" id="app-content">
            <div class="spinner-container">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF for PDF generation in submission workflow -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Dashboard Controller -->
    <script src="js/student.js?v=4"></script>
</body>

</html>
